name: Auto Tag Version Bump

on:
  push:
    branches:
      - main
    paths:
      - 'flutterobd2/pubspec.yaml'

permissions:
  contents: write

jobs:
  tag-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Fetches the current and previous commit to allow a git diff

      - name: Check if version changed and create tag
        run: |
          # 1. Parse the version from the previous commit
          OLD_VERSION=$(git show HEAD~1:flutterobd2/pubspec.yaml | grep '^version:' | awk '{print $2}')
          
          # 2. Parse the version from the current commit
          NEW_VERSION=$(grep '^version:' flutterobd2/pubspec.yaml | awk '{print $2}')
          
          echo "Previous pubspec version: $OLD_VERSION"
          echo "Current pubspec version: $NEW_VERSION"
          
          # 3. If they don't match, push the new tag
          if [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
            echo "The pubspec file changed, but the version string didn't. Skipping tag."
          else
            echo "Version bump detected! Checking if tag $NEW_VERSION already exists..."
            
            # Check if this tag already exists in the repository
            if git rev-parse "$NEW_VERSION" >/dev/null 2>&1; then
              echo "Error: Tag $NEW_VERSION already exists. Did you forget to increment properly?"
              exit 1
            fi
            
            echo "Creating and pushing tag: $NEW_VERSION"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            
            git tag "$NEW_VERSION"
            git push origin "$NEW_VERSION"
          fi

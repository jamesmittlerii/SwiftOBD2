name: SonarCloud

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  swift-coverage:
    name: Swift Test Coverage (SwiftPM)
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Toolchain info
        run: |
          swift --version
          xcodebuild -version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Run tests with coverage
        run: |
          set -euo pipefail
          swift test --enable-code-coverage --parallel

      - name: Convert coverage to Sonar Generic XML
        run: |
          chmod +x scripts/xccov-to-sonar-generic.sh
          ./scripts/xccov-to-sonar-generic.sh

      - name: Upload Swift coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: swift-coverage-xml
          path: coverage/sonar-generic-coverage.xml

  scan:
    name: Test Coverage & Scan
    runs-on: ubuntu-latest
    needs: [ swift-coverage ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download Swift coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: swift-coverage-xml
          path: coverage

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Install Flutter dependencies
        working-directory: flutterobd2
        run: flutter pub get

      - name: Generate Flutter coverage
        working-directory: flutterobd2
        run: flutter test --coverage

      - name: Make Kotlin Gradle wrapper executable
        working-directory: kotlinobd2
        run: chmod +x gradlew

      - name: Generate Kotlin JaCoCo coverage
        working-directory: kotlinobd2
        run: ./gradlew :test :jacocoTestReport

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

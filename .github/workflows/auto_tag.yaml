name: Auto Tag Version Bump

on:
  push:
    branches:
      - main
    paths:
      - 'flutterobd2/pubspec.yaml'

jobs:
  tag-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Generate Tag and Dispatch Publish
        env:
          GH_TOKEN: ${{ secrets.TAG_PUSH_TOKEN }}
        run: |
          OLD_VERSION=$(git show HEAD~1:flutterobd2/pubspec.yaml | grep '^version:' | awk '{print $2}')
          NEW_VERSION=$(grep '^version:' flutterobd2/pubspec.yaml | awk '{print $2}')
          
          echo "Old version: $OLD_VERSION"
          echo "New version: $NEW_VERSION"
          
          if [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
            echo "Version has not changed. Skipping release."
          else
            if git rev-parse "$NEW_VERSION" >/dev/null 2>&1; then
              echo "Error: Tag $NEW_VERSION already exists."
              exit 1
            fi
            
            # Configure Git Bot
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            
            # Create and push the tag to Git
            git tag "$NEW_VERSION"
            git push origin "$NEW_VERSION"
            
            # Force-dispatch the publish workflow pointing explicitly to the fresh tag ref
            echo "Dispatching pub.dev publish workflow for tag $NEW_VERSION..."
            gh workflow run flutter_publish.yml --ref "refs/tags/$NEW_VERSION"
          fi

name: Publish to Pub.dev

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*' # Matches 1.0.0, 2.1.4, etc.
  workflow_dispatch:          # Enables the manual run button

# This gives the reusable workflow permission to request the OIDC token
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: flutterobd2

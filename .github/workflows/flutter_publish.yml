name: Publish to Pub.dev

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*' # Triggered explicitly by raw tags (e.g., 0.1.11)
  workflow_dispatch:          # Manual fallback

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    # Call the official reusable Dart publishing workflow directly at the job level
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: flutterobd2

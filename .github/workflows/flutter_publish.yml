name: Publish to Pub.dev

on:
  workflow_dispatch:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*' # Matches 1.0.0, 2.1.4-beta, etc.

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: |
          cd flutterobd2
          flutter pub get

      # Verifies the tag matches the exact version inside pubspec.yaml
      - name: Verify tag matches pubspec version
        run: |
          PUBSPEC_VERSION=$(grep '^version:' flutterobd2/pubspec.yaml | awk '{print $2}')
          # Strips "refs/tags/" to extract just the raw tag name
          TAG_VERSION=${GITHUB_REF#refs/tags/}
          
          echo "Pubspec version: $PUBSPEC_VERSION"
          echo "Tag version: $TAG_VERSION"
          
          if [ "$PUBSPEC_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: Git tag ($TAG_VERSION) does not match pubspec version ($PUBSPEC_VERSION)"
            exit 1
          fi

      - name: Publish Package
        uses: dart-lang/setup-dart/publish@v1
        with:
          working-directory: flutterobd2

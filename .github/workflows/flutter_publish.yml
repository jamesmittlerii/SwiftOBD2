name: Publish to Pub.dev

on:
  push:
    branches:
      - main
    paths:
      - 'flutterobd2/pubspec.yaml'
  workflow_dispatch: # Keeps your manual trigger active

permissions:
  id-token: write
  contents: write    # Grants permission to create git tags natively

jobs:
  # Job 1: Check the version, and tag it if it is a new version bump
  check-and-tag:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.changed }}
      new_version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Inspect Version Change
        id: check
        run: |
          OLD_VERSION=$(git show HEAD~1:flutterobd2/pubspec.yaml | grep '^version:' | awk '{print $2}')
          NEW_VERSION=$(grep '^version:' flutterobd2/pubspec.yaml | awk '{print $2}')
          
          echo "Old version: $OLD_VERSION"
          echo "New version: $NEW_VERSION"
          
          if [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
            echo "Version has not changed. Skipping release."
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            if git rev-parse "$NEW_VERSION" >/dev/null 2>&1; then
              echo "Error: Tag $NEW_VERSION already exists on the server!"
              exit 1
            fi
            
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
            
            # Create and push the tag natively using standard GITHUB_TOKEN permissions
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$NEW_VERSION"
            git push origin "$NEW_VERSION"
          fi

  # Job 2: Run the deployment if Job 1 confirms a version increment occurred
  publish:
    needs: check-and-tag
    if: ${{ needs.check-and-tag.outputs.version_changed == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: flutterobd2
